      :root {
        --bg: #fbf9f4;
        --ink: #1f1c18;
        --dim: #8a8178;
        --faint: #b0a794;
        --accent: #3f6e5a;
        --accent-warm: #c96f4a;
        --yellow: #f5c518;
        --line: #e8e2d6;
        --card: #ffffff;
        --grid: rgba(31, 28, 24, 0.03);
        --note-rot: -2.5deg;
      }
      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
      }
      body {
        background: var(--bg);
        background-image:
          linear-gradient(to right, var(--grid) 1px, transparent 1px),
          linear-gradient(to bottom, var(--grid) 1px, transparent 1px);
        background-size: 36px 36px;
        color: var(--ink);
        font-family:
          "Noto Sans SC", "PingFang SC", "Hiragino Sans GB", "Microsoft YaHei",
          system-ui, sans-serif;
        min-height: 100vh;
        display: flex;
        flex-direction: column;
        overflow-x: clip;
        -webkit-font-smoothing: antialiased;
        font-synthesis: none;
      }
      .wrap {
        width: 100%;
        max-width: 1240px;
        margin: 0 auto;
        padding: 0 clamp(20px, 4vw, 48px);
        display: flex;
        flex-direction: column;
        flex: 1;
      }
      header {
        display: flex;
        justify-content: space-between;
        align-items: baseline;
        padding: 24px 0;
        border-bottom: 1.5px solid var(--ink);
      }
      .wordmark {
        font-family: "Noto Serif SC", "Songti SC", serif;
        font-weight: 900;
        font-size: 17px;
      }
      .wordmark span {
        color: var(--dim);
        font-weight: 400;
        font-size: 13px;
        margin-left: 8px;
        font-family: "Noto Sans SC", sans-serif;
      }
      .domain {
        font-size: 12px;
        color: var(--faint);
        font-family: ui-monospace, "SF Mono", Consolas, monospace;
      }

      main {
        flex: 1;
        display: grid;
        grid-template-columns: 1fr 1.15fr;
        gap: clamp(32px, 4vw, 56px);
        align-items: center;
        padding: clamp(40px, 7vh, 80px) 0;
        min-width: 0;
        max-width: 100%;
      }
      main > .text,
      main > .stage {
        min-width: 0;
        max-width: 100%;
      }
      @media (max-width: 1100px) {
        main {
          grid-template-columns: 1fr;
        }
        .text {
          width: 100%;
        }
      }

      .greeting {
        font-size: 15px;
        color: var(--dim);
        margin-bottom: 24px;
      }
      h1 {
        font-family: "Noto Serif SC", "Songti SC", "STSong", serif;
        font-size: clamp(25px, 3.8vw, 42px);
        font-weight: 900;
        line-height: 1.45;
        letter-spacing: 0.01em;
      }
      h1 .line {
        white-space: nowrap;
      }
      h1 .u {
        text-decoration: underline;
        text-decoration-color: var(--yellow);
        text-decoration-thickness: 0.32em;
        text-underline-offset: -0.12em;
        text-decoration-skip-ink: none;
      }
      .tagline {
        margin-top: 28px;
        font-size: 16px;
        color: var(--dim);
        line-height: 2;
        max-width: 30em;
      }
      .findme {
        margin-top: 40px;
        padding: 18px 22px;
        background: var(--card);
        border: 1px solid var(--line);
        border-radius: 14px;
        max-width: 440px;
      }
      .findme .hint {
        font-size: 13px;
        color: var(--faint);
        margin-bottom: 12px;
      }
      .findme .links {
        display: flex;
        flex-wrap: wrap;
        gap: 8px 22px;
      }
      .findme a {
        color: var(--accent);
        text-decoration: none;
        font-size: 15px;
        font-weight: 500;
        border-bottom: 1px solid transparent;
      }
      .findme a:hover {
        border-bottom-color: var(--accent);
      }
      .findme a span {
        color: var(--faint);
        font-weight: 400;
        font-size: 13px;
        margin-left: 4px;
      }
      @media (max-width: 1100px) {
        .findme {
          max-width: none;
          width: 100%;
        }
      }

      /* ---------- 舞台：便签 + 人物 ---------- */
      .stage {
        display: flex;
        justify-content: center;
      }
      /* 热区放在不动的 note-wrap 上：便签大幅位移时鼠标不会"滑出"导致来回抖动 */
      .note-wrap {
        position: relative;
        cursor: pointer;
      }
      .note-wrap .note {
        pointer-events: none;
      }
      @media (max-width: 1100px) and (min-width: 641px) {
        .stage {
          justify-content: flex-start;
        }
      }
      @media (max-width: 640px) {
        .wrap {
          padding-inline: 16px;
          overflow-x: clip;
        }
        h1 .line {
          white-space: normal;
        }
        .stage {
          justify-content: flex-start;
          overflow-x: clip;
        }
      }

      .note {
        position: relative;
        z-index: 1;
        width: min(320px, 100%);
        aspect-ratio: 1 / 1.05;
        background: linear-gradient(
          175deg,
          #fff6a8 0%,
          #ffed85 60%,
          #fbe878 100%
        );
        border-radius: 3px;
        box-shadow:
          0 14px 30px rgba(31, 28, 24, 0.14),
          0 2px 6px rgba(31, 28, 24, 0.08);
        transform: rotate(var(--note-rot));
        padding: 44px 28px 24px;
        display: flex;
        flex-direction: column;
        cursor: pointer;
        transition:
          transform 0.6s cubic-bezier(0.3, 1.35, 0.5, 1),
          box-shadow 0.5s ease;
      }
      /* 便签被「抽走」：顺时针转、右上角下沉，人物的手肘失去支撑 */
      .note-wrap.pulled .note {
        /* 幅度加大：右上角明显下沉并向左滑开，手肘下方瞬间悬空 */
        transform: rotate(7deg) translate(-26px, 18px);
        transition:
          transform 0.3s cubic-bezier(0.2, 0.9, 0.3, 1.18),
          box-shadow 0.3s ease;
        box-shadow:
          0 26px 44px rgba(31, 28, 24, 0.18),
          0 4px 10px rgba(31, 28, 24, 0.08);
      }
      @media (max-width: 640px) {
        .note {
          width: min(240px, 62vw);
          padding: 36px 20px 18px;
        }
        .note .n-mid {
          font-size: 18px !important;
        }
        .note svg {
          width: 110px;
        }
      }
      @media (min-width: 641px) and (max-width: 1100px) {
        .note {
          width: min(280px, 100%);
        }
        .note .n-mid {
          font-size: 21px !important;
        }
      }
      .note::before {
        content: "";
        position: absolute;
        top: -12px;
        left: 50%;
        width: 96px;
        height: 28px;
        transform: translateX(-50%) rotate(2deg);
        background: rgba(255, 255, 255, 0.55);
        border-left: 1px dashed rgba(31, 28, 24, 0.12);
        border-right: 1px dashed rgba(31, 28, 24, 0.12);
        box-shadow: 0 2px 4px rgba(31, 28, 24, 0.06);
      }
      .note .n-mid {
        font-family: "Noto Serif SC", "Songti SC", serif;
        font-weight: 700;
        font-size: 24px;
        line-height: 1.65;
        margin-top: 18px;
      }
      .note .n-mid .u {
        text-decoration: underline;
        text-decoration-color: var(--accent-warm);
        text-decoration-thickness: 3px;
        text-underline-offset: 4px;
      }
      .note svg {
        margin-top: auto;
      }
      .note .n-sign {
        margin-top: 10px;
        font-size: 13px;
        color: rgba(31, 28, 24, 0.55);
        text-align: right;
      }

      /* ---------- 人物 ----------
     素材是透明底，盖在便签上。投影加在容器上，内部两张图正常叠放。 */
      .char {
        position: absolute;
        z-index: 2;
        pointer-events: none;
        filter: drop-shadow(0 8px 12px rgba(31, 28, 24, 0.14));
        transform-origin: 55% 91%; /* 脚底附近，踉跄围绕双脚发生 */
        animation: breathe 4.2s ease-in-out infinite;
        opacity: 0;
        transition: opacity 0.3s ease;
      }
      .char.ready.prepared {
        opacity: 1;
      }
      .char img {
        position: absolute;
        inset: 0;
        width: 100%;
        height: 100%;
        display: block;
        user-select: none;
      }
      .char .trip {
        opacity: 0;
        transform: translate(-2%, 3%);
      }

      /* 站着靠时只做极轻的呼吸，避免手肘离开便签角 */
      @keyframes breathe {
        0%,
        100% {
          transform: translateY(0);
        }
        50% {
          transform: translateY(-1.5px);
        }
      }

      /* 失去支撑：先往便签方向一沉（倚靠图）→ 切换踉跄图 → 来回晃两下站稳 */
      .char.fall {
        /* 比便签晚 90ms 才开始掉：先看到支撑点消失，再看到人失衡 */
        animation:
          fall 1s cubic-bezier(0.3, 0.7, 0.35, 1) 0.09s both,
          sway 2.6s ease-in-out 1.09s infinite;
      }
      .char.fall .lean {
        animation: leanOut 1s linear 0.09s both;
      }
      .char.fall .trip {
        animation: tripIn 1s linear 0.09s both;
      }
      @keyframes fall {
        0% {
          transform: rotate(0) translate(0, 0);
        }
        12% {
          transform: rotate(-6deg) translate(-6px, 6px);
        }
        30% {
          transform: rotate(-10deg) translate(-16px, 8px);
        }
        52% {
          transform: rotate(4deg) translate(-8px, 2px);
        }
        72% {
          transform: rotate(-2.5deg) translate(-10px, 3px);
        }
        88% {
          transform: rotate(1deg) translate(-9px, 2px);
        }
        100% {
          transform: rotate(0) translate(-9px, 2px);
        }
      }
      @keyframes sway {
        0%,
        100% {
          transform: rotate(0) translate(-9px, 2px);
        }
        50% {
          transform: rotate(-1.6deg) translate(-9px, 2px);
        }
      }
      @keyframes leanOut {
        0%,
        11% {
          opacity: 1;
        }
        15%,
        100% {
          opacity: 0;
        }
      }
      @keyframes tripIn {
        0%,
        11% {
          opacity: 0;
        }
        15%,
        100% {
          opacity: 1;
        }
      }

      /* 便签回来：重新靠上去，轻微回弹 */
      .char.recover {
        animation: recover 0.75s cubic-bezier(0.3, 0.8, 0.3, 1) forwards;
      }
      .char.recover .trip {
        animation: tripOut 0.75s linear forwards;
      }
      .char.recover .lean {
        animation: leanIn 0.75s linear forwards;
      }
      @keyframes recover {
        0% {
          transform: rotate(-4deg) translate(-8px, 3px);
        }
        40% {
          transform: rotate(2deg) translate(1px, -2px);
        }
        68% {
          transform: rotate(-0.8deg) translate(0, 0);
        }
        100% {
          transform: rotate(0) translate(0, 0);
        }
      }
      @keyframes tripOut {
        0%,
        22% {
          opacity: 1;
        }
        28%,
        100% {
          opacity: 0;
        }
      }
      @keyframes leanIn {
        0%,
        22% {
          opacity: 0;
        }
        28%,
        100% {
          opacity: 1;
        }
      }

      /* 对话气泡（不参与 multiply，单独放在 note-wrap 里） */
      .bubble {
        position: absolute;
        z-index: 3;
        pointer-events: none;
        padding: 6px 12px;
        background: #fff;
        border: 1.5px solid var(--ink);
        border-radius: 14px;
        font-family: "Noto Serif SC", serif;
        font-weight: 700;
        font-size: 15px;
        white-space: nowrap;
        opacity: 0;
        transform: translateY(6px) scale(0.9);
        transform-origin: bottom right;
        transition:
          opacity 0.18s ease,
          transform 0.25s cubic-bezier(0.3, 1.5, 0.5, 1);
      }
      .bubble::after {
        content: "";
        position: absolute;
        right: 14px;
        bottom: -7px;
        width: 10px;
        height: 10px;
        background: #fff;
        border-right: 1.5px solid var(--ink);
        border-bottom: 1.5px solid var(--ink);
        transform: rotate(45deg);
      }
      .bubble.show {
        opacity: 1;
        transform: translateY(0) scale(1);
      }

      @media (prefers-reduced-motion: reduce) {
        .char,
        .char.fall,
        .char.recover {
          animation: none !important;
        }
        .char.fall .lean {
          animation: none;
          opacity: 0;
        }
        .char.fall .trip {
          animation: none;
          opacity: 1;
        }
        .char.recover .lean,
        .char.recover .trip {
          animation: none;
        }
        .note {
          transition: none;
        }
      }

      footer {
        padding: 20px 0;
        font-size: 12px;
        color: var(--faint);
        border-top: 1px solid var(--line);
        display: flex;
        justify-content: space-between;
        flex-wrap: wrap;
        gap: 8px;
      }
    </style>

            <div class="links">

                rel="noopener noreferrer"

              aria-label="超纯的 IP 形象：戴黑色渔夫帽和方框眼镜的小人，手肘靠在便签右上角"

    <script>
      (function () {
        // 倚靠图里「手肘落点」在图片中的相对坐标（前臂下沿、垂下的手左侧）
        // 想微调贴合度，只改这两个数即可
        var ELBOW_X = 0.258;
        var ELBOW_Y = 0.408;
        var IMG_RATIO = 864 / 1152; // 宽 / 高
        var VISIBLE_RIGHT = 0.66; // 人物可见部分的最右侧（用于给舞台留空间）
        var HEAD_TOP = 0.07; // 帽顶在图中的相对高度

        var wrap = document.getElementById("noteWrap");
        var note = document.getElementById("note");
        var ch = document.getElementById("char");
        var bubble = document.getElementById("bubble");

        function noteAngle() {
          var v = getComputedStyle(document.documentElement).getPropertyValue(
            "--note-rot",
          );
          return ((parseFloat(v) || -2.5) * Math.PI) / 180;
        }

        function layout() {
          var narrow = window.innerWidth <= 640;
          var scaleK = narrow ? 1.55 : 1.9; // 人物高度 = 便签宽 × k
          var stageEl = wrap.closest(".stage");
          var avail = stageEl
            ? stageEl.clientWidth
            : wrap.parentElement.clientWidth;
          var a = noteAngle();
          var cosA = Math.cos(a),
            sinA = Math.sin(a);
          var noteAR = 1.05; // 与 CSS aspect-ratio: 1 / 1.05 一致

          function fitNoteWidth(budget) {
            var lo = 160,
              hi = Math.max(161, budget);
            for (var i = 0; i < 16; i++) {
              var trial = (lo + hi) / 2;
              var tH = trial * noteAR;
              var tCornerX = trial / 2 + (trial / 2) * cosA - (-tH / 2) * sinA;
              var tW = trial * scaleK * IMG_RATIO;
              var visR = tCornerX - ELBOW_X * tW + tW * VISIBLE_RIGHT;
              if (visR > budget) hi = trial;
              else lo = trial;
            }
            return lo;
          }
          function rotatedLeftOverhang(tw, th) {
            var cx = tw / 2,
              cy = th / 2;
            var pts = [
              [0, 0],
              [tw, 0],
              [0, th],
              [tw, th],
            ];
            var minX = 0;
            for (var p = 0; p < 4; p++) {
              var rx = pts[p][0] - cx,
                ry = pts[p][1] - cy;
              var x = cx + rx * cosA - ry * sinA;
              if (x < minX) minX = x;
            }
            return Math.max(0, -minX);
          }

          // 窄屏：人物可见右缘对齐内容右缘；便签旋转探出的左侧用 margin 补回
          var leftShift = 0;
          if (narrow && avail) {
            var fitted = fitNoteWidth(avail);
            leftShift = rotatedLeftOverhang(fitted, fitted * noteAR);
            if (leftShift > 0.5) fitted = fitNoteWidth(avail - leftShift);
            if (Math.abs((parseFloat(note.style.width) || 0) - fitted) > 0.5) {
              note.style.width = fitted + "px";
            }
          } else if (note.style.width) {
            note.style.width = "";
          }

          var W = note.offsetWidth,
            H = note.offsetHeight;
          if (!W || !H) return;
          var dx = W / 2,
            dy = -H / 2;
          var cornerX = W / 2 + dx * cosA - dy * sinA;
          var cornerY = H / 2 + dx * sinA + dy * cosA;

          var h = W * scaleK,
            w = h * IMG_RATIO;
          var left = cornerX - ELBOW_X * w;
          var top = cornerY - ELBOW_Y * h;

          ch.style.width = w + "px";
          ch.style.height = h + "px";
          ch.style.left = left + "px";
          ch.style.top = top + "px";

          // 给人物留出右侧和上方空间，避免和标题/边缘打架
          var overhangR = Math.max(0, left + w * VISIBLE_RIGHT - W);
          var overhangT = Math.max(0, -(top + HEAD_TOP * h));
          if (narrow) {
            wrap.style.marginRight = "0";
            wrap.style.marginLeft = leftShift ? leftShift + "px" : "0";
          } else {
            wrap.style.marginRight = overhangR + "px";
            wrap.style.marginLeft = "";
          }
          wrap.style.marginTop = overhangT + "px";

          // 气泡放在人物头部左上
          bubble.style.left = left + w * 0.02 + "px";
          bubble.style.top = top + h * 0.06 + "px";

          ch.classList.add("ready");
        }

        // ---------- 交互状态机 ----------
        var pulled = false,
          bubbleTimer = null;

        function say(text, ms) {
          clearTimeout(bubbleTimer);
          bubble.textContent = text;
          bubble.classList.add("show");
          if (ms)
            bubbleTimer = setTimeout(function () {
              bubble.classList.remove("show");
            }, ms);
        }

        function restart(el, cls) {
          el.classList.remove("fall", "recover");
          void el.offsetWidth; // 重新触发动画
          el.classList.add(cls);
        }

        function pull() {
          if (pulled) return;
          pulled = true;
          wrap.classList.add("pulled");
          restart(ch, "fall");
          setTimeout(function () {
            if (pulled) say("诶——！");
          }, 120);
        }

        function release() {
          if (!pulled) return;
          pulled = false;
          wrap.classList.remove("pulled");
          restart(ch, "recover");
          say("呼…还好", 1100);
          setTimeout(function () {
            if (!pulled) ch.classList.remove("recover");
          }, 800);
        }

        var canHover = window.matchMedia("(hover: hover)").matches;
        if (canHover) {
          wrap.addEventListener("mouseenter", pull);
          wrap.addEventListener("mouseleave", release);
        } else {
          wrap.addEventListener("click", function () {
            pulled ? release() : pull();
          });
        }

        // 两张图都加载完再显示，避免倚靠/踉跄切换时闪一下
        function imagesReady() {
          layout();
          ch.classList.add("prepared");
        }
        var imgs = ch.querySelectorAll("img"),
          left = imgs.length;
        if (!left) imagesReady();
        imgs.forEach(function (img) {
          if (img.complete) {
            if (--left === 0) imagesReady();
          } else {
            img.addEventListener("load", function () {
              if (--left === 0) imagesReady();
            });
            img.addEventListener("error", function () {
              if (--left === 0) imagesReady();
            });
          }
        });

        layout();
        window.addEventListener("resize", layout);
        if (document.fonts && document.fonts.ready)
          document.fonts.ready.then(layout);
        if (window.ResizeObserver) new ResizeObserver(layout).observe(note);
      })();
    </script>
